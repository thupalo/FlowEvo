[project]
name = "flowevo"
version = "0.1.0"
description = "FlowEvo: self-evolving agents through the co-evolution of workflows and executable skills"
requires-python = ">=3.9"
dependencies = [
  "pydantic>=2.0",
  "datasets>=2.19.0",
  "PyYAML>=6.0",
  "requests>=2.31.0",
]

[project.optional-dependencies]
# ALFWorld environment adapter (src/alfworld_); also run `alfworld-download`
# once to fetch the game files.
alfworld = ["alfworld>=0.4"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
