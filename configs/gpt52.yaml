llm:
  provider: openai-codex
  base_url: https://chatgpt.com/backend-api/codex
  model: gpt-5.2
  app_name: flowevo
  local_override_path: configs/local.yaml
  skill_top_k: 3
  skill_context_budgets:
    draft_total_tokens: 1800
    repair_total_tokens: 1000
    draft_per_skill_tokens: 550
    repair_per_skill_tokens: 300
  draft:
    temperature: 0.2
    max_output_tokens: 900
  repair:
    temperature: 0.15
    max_output_tokens: 900
